<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get Aidova AAC</title>
<meta name="robots" content="noindex">
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#F0F7F2;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;text-align:center}
  .box{max-width:360px}
  .logo{font-size:2.4rem;margin-bottom:8px}
  h1{color:#1B5E20;font-size:1.3rem;margin:0 0 6px}
  p{color:#666;font-size:.9rem;margin:0 0 22px}
  a.btn{display:inline-block;background:#2D6A4F;color:#fff;text-decoration:none;font-weight:700;padding:14px 28px;border-radius:14px;font-size:1rem}
  .spinner{width:28px;height:28px;border:3px solid #cde5d6;border-top-color:#2D6A4F;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div class="logo">🗣️</div>
    <h1>Taking you to Aidova AAC…</h1>
    <p>If nothing happens in a few seconds, tap the button below.</p>
    <a class="btn" id="fallback" href="https://aidova.app">Open Aidova</a>
  </div>
<script>
  var ua = navigator.userAgent || navigator.vendor || window.opera;
  var iosUrl = "https://apps.apple.com/app/aidova-aac-communication-app/id6778934042";
  var androidUrl = "https://play.google.com/store/apps/details?id=app.aidova.twa";
  var webUrl = "https://aidova.app";

  var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  var isAndroid = /android/i.test(ua);

  var target = webUrl;
  if (isIOS) target = iosUrl;
  else if (isAndroid) target = androidUrl;

  document.getElementById('fallback').href = target;

  setTimeout(function(){ window.location.href = target; }, 400);
</script>
</body>
</html>
