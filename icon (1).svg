<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#2D6A4F"/>
  
  <!-- Speech bubble shape -->
  <rect x="80" y="100" width="320" height="240" rx="50" fill="#52B788"/>
  <polygon points="130,340 100,410 200,340" fill="#52B788"/>
  
  <!-- Letter A styled -->
  <text x="256" y="290" 
    font-family="Georgia, serif" 
    font-size="180" 
    font-weight="900"
    text-anchor="middle" 
    fill="white"
    opacity="0.95">A</text>

  <!-- Small dots suggesting communication -->
  <circle cx="170" cy="220" r="18" fill="white" opacity="0.9"/>
  <circle cx="256" cy="220" r="18" fill="white" opacity="0.9"/>
  <circle cx="342" cy="220" r="18" fill="white" opacity="0.9"/>
</svg>
